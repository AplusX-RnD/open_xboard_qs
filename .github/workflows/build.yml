name: Build firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# The workflow only reads the repository; artifacts are uploaded with the
# default token, which needs no further scope.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    # Pinned by digest so every CI build uses the same toolchain. Update the
    # tag and digest together (docker buildx imagetools inspect ghcr.io/qmk/qmk_cli:<tag>).
    container: ghcr.io/qmk/qmk_cli:1.2.0@sha256:b7d7fa8fb4432b569931de5ad59098cb788f440ed61a62c5126746b71aee0f4a
    strategy:
      fail-fast: false
      matrix:
        variant: [via, vial, srgb]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory '*'

      - name: Prepare firmware trees (nested submodules, patches, keyboard link)
        run: scripts/setup.sh

      - name: Build
        run: scripts/build.sh ${{ matrix.variant }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xboard_qs-${{ matrix.variant }}
          path: build/*.bin
          if-no-files-found: error
